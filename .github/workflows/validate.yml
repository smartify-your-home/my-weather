name: Validate my-weather integration
on:
  push:
    branches: [main]
    paths:
      - 'custom_components/my_weather/**'
      - 'tests/**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'custom_components/my_weather/**'
      - 'tests/**'
      - '.github/workflows/validate.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install standalone test dependency
        run: python -m pip install PyYAML
      - name: Run deterministic offline unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Compile all Python integration modules
        run: python -m compileall -q custom_components/my_weather
      - name: Validate integration JSON metadata and translations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("custom_components/my_weather")
          assert json.loads((root / "manifest.json").read_text())["domain"] == "my_weather"
          for file in (root / "strings.json", *sorted((root / "translations").glob("*.json"))):
              json.loads(file.read_text())
          print("All JSON configuration files validated.")
          PY
